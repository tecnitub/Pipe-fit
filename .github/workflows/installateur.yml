# Tests + construction de l'installateur Windows et du pack de déploiement à chaque envoi.
# PipeFitCRM-Setup-x.y.z.exe et PipeFit-Pack-x.y.z.zip (installateur + scripts Linux / Docker / Microsoft 365 +
# mode d'emploi) sont téléchargeables dans l'onglet Actions > exécution > Artifacts.
name: Installateur Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: bash installer/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PipeFitCRM-Setup
          path: dist/*.exe
      - run: bash deploy/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PipeFit-Pack
          path: dist/PipeFit-Pack-*.zip
