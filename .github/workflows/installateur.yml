# Tests + construction de l'installateur Windows à chaque envoi.
# Les fichiers PipeFitCRM-Setup-x.y.z.exe et AtelierPDF-Setup-x.y.z.exe sont téléchargeables dans l'onglet Actions > exécution > Artifacts.
name: Installateur Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - run: bash installer/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PipeFitCRM-Setup
          path: dist/PipeFitCRM-Setup-*.exe
      # Atelier PDF : installateur Windows et version « un seul fichier » (sans installation)
      - run: bash installer/build-pdf.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AtelierPDF-Setup
          path: |
            dist/AtelierPDF-Setup-*.exe
            dist/AtelierPDF.html
